# Builds and publishes everything a release needs, automatically, when you
# push a version tag:
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
#  1. runs the full test suites (server e2e + desktop supervision core)
#  2. builds the Windows desktop installer (Nimbus Drive Setup.exe)
#  3. attaches the installer to the GitHub Release for that tag
#
# New users then download ONE file — the Setup.exe from your Releases page —
# and the app installs the drive itself. The app also checks this repo's
# Releases for updates.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm --prefix server install --no-audit --no-fund
          npm --prefix web install --no-audit --no-fund
      - name: Build web app (needed by the desktop core test)
        run: npm --prefix web run build
      - name: Server end-to-end tests
        run: node scripts/dev/e2e.mjs
      - name: Multiple attached folders tests
        run: node scripts/dev/libraries-test.mjs
      - name: Desktop supervision core tests
        run: node scripts/dev/desktop-core-test.mjs
      - name: Domain & sign-in verifier tests
        run: node scripts/dev/verify-test.mjs
      - name: Windows autostart / no-UAC tests
        run: node scripts/dev/autostart-test.mjs
      - name: Install cloudflared (the config generator is checked against the real binary)
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version
        shell: bash
      - name: Cloudflare tunnel launch tests
        run: node scripts/dev/tunnel-test.mjs
      - name: Tunnel config discovery & fallback tests
        run: node scripts/dev/cfconfig-test.mjs
      - name: In-app tunnel setup tests
        run: node scripts/dev/cftunnel-test.mjs
      - name: Install Playwright (renderer tests drive the real Settings UI)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Settings persistence (renderer) tests
        run: node scripts/dev/ui-settings-test.mjs
      - name: Theme & contrast audit
        run: node scripts/dev/ui-theme-test.mjs

  installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install desktop app dependencies
        run: npm --prefix desktop install --no-audit --no-fund
      - name: Match the app version to the release tag
        # The installer's version (and the self-updater's latest.yml) must match
        # the git tag — without this sync, tagging v1.0.1 while package.json
        # still says 1.0.0 quietly targets the wrong release.
        shell: bash
        run: npm --prefix desktop version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Build the Windows installer (no publishing here)
        # electron-builder ONLY builds. Its built-in GitHub publisher proved
        # unreliable (green runs with the .exe/latest.yml silently missing), so
        # uploading is done by the dedicated release action below instead.
        run: npm --prefix desktop run dist:build
      - name: Upload installer + update metadata to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the release is complete (fail loudly if not)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "Release $GITHUB_REF_NAME assets:"; echo "$assets"
          echo "$assets" | grep -q '\.exe$'    || { echo '::error::installer .exe missing from the release'; exit 1; }
          echo "$assets" | grep -q 'latest.yml' || { echo '::error::latest.yml (self-update metadata) missing from the release'; exit 1; }
          # The self-updater downloads exactly the filename recorded in latest.yml.
          # GitHub rewrites spaces in uploaded asset names, so a name with spaces
          # silently 404s the update. Fail the build instead of shipping that.
          # (electron-builder writes `path:` at column 0; fall back to files[].url.)
          named=$(sed -n 's/^[[:space:]]*path:[[:space:]]*//p' desktop/dist/latest.yml | head -1 | tr -d '\r' | sed 's/^["'"'"']//; s/["'"'"']$//')
          if [ -z "$named" ]; then
            named=$(sed -n 's/^[[:space:]]*-\{0,1\}[[:space:]]*url:[[:space:]]*//p' desktop/dist/latest.yml | head -1 | tr -d '\r' | sed 's/^["'"'"']//; s/["'"'"']$//')
          fi
          echo "latest.yml points at: [$named]"
          [ -n "$named" ] || { echo '::error::could not read the installer name from latest.yml'; cat desktop/dist/latest.yml; exit 1; }
          case "$named" in *" "*) echo "::error::installer name contains spaces — GitHub will rename it and self-update will 404"; exit 1;; esac
          echo "$assets" | grep -qxF "$named" || { echo "::error::latest.yml names '$named' but no such asset exists in the release"; exit 1; }
          echo "self-update metadata matches the uploaded installer ✓"
